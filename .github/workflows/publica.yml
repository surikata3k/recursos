name: Publica la web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construeix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instal·la MkDocs
        run: pip install -r requirements.txt

      - name: Construeix la web
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publica:
    needs: construeix
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegament.outputs.page_url }}
    steps:
      - id: desplegament
        uses: actions/deploy-pages@v4
