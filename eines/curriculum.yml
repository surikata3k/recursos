# Dades curriculars (XTEC, currículums 2024).
# El script eines/genera_estructura.py llegeix aquest fitxer i crea les
# carpetes i pàgines que encara no existeixin. Mai sobreescriu res.
#
# Per afegir un mòdul nou: copia un bloc de mòdul, omple-ho i executa
#   python3 eines/genera_estructura.py

cicles:
  - id: smx
    nom: "SMX"
    titol: "Sistemes Microinformàtics i Xarxes"
    grau: "CFGM"
    icona: "material/desktop-tower-monitor"
    moduls:
      - codi: "0224"
        nom: "Sistemes operatius en xarxa"
        ras:
          - curt: "Instal·lació de SO en xarxa"
            text: "Instal·la sistemes operatius en xarxa descrivint-ne les característiques i interpretant-ne la documentació tècnica."
            criteris:
              - "Realitza l'estudi de compatibilitat del sistema informàtic."
              - "Diferencia els modes d'instal·lació."
              - "Planifica i realitza el particionat del disc del servidor."
              - "Selecciona i aplica els sistemes d'arxius."
              - "Selecciona els components a instal·lar."
              - "Aplica procediments per l'automatització d'instal·lacions."
              - "Aplica preferències en la configuració de l'entorn personal."
              - "Actualitza el sistema operatiu en xarxa."
              - "Comprova la connectivitat del servidor amb els equips client."
          - curt: "Usuaris i grups"
            text: "Gestiona usuaris i grups de sistemes operatius en xarxa, interpretant especificacions i aplicant eines del sistema."
            criteris:
              - "Configura i gestiona comptes d'usuari."
              - "Configura i gestiona perfils d'usuari."
              - "Configura i gestiona comptes d'equip."
              - "Distingeix el propòsit dels grups, els seus tipus i àmbits."
              - "Configura i gestiona grups."
              - "Gestiona la pertinença d'usuaris a grups."
              - "Identifica les característiques d'usuaris i grups predeterminats i especials."
              - "Planifica perfils mòbils d'usuaris."
              - "Utilitza eines per a l'administració d'usuaris i grups, incloses en el sistema operatiu en xarxa."
          - curt: "Dominis i servei de directori"
            text: "Realitza tasques de gestió sobre dominis identificant necessitats i aplicant eines d'administració de dominis."
            criteris:
              - "Identifica la funció del servei de directori, els seus elements i nomenclatura."
              - "Reconeix el concepte de domini i les seves funcions."
              - "Estableix relacions de confiança entre dominis."
              - "Realitza la instal·lació del servei de directori."
              - "Realitza la configuració bàsica del servei de directori."
              - "Utilitza agrupacions d'elements per a la creació de models administratius."
              - "Analitza l'estructura del servei de directori."
              - "Utilitza eines d'administració de dominis."
          - curt: "Recursos compartits"
            text: "Gestiona els recursos compartits del sistema, interpretant especificacions i determinant nivells de seguretat."
            criteris:
              - "Reconeix la diferència entre permís i dret."
              - "Identifica els recursos del sistema que es compartiran i en quines condicions."
              - "Assigna permisos als recursos del sistema que es compartiran."
              - "Comparteix impressores en xarxa."
              - "Utilitza l'entorn gràfic per compartir recursos."
              - "Estableix nivells de seguretat per controlar l'accés del client als recursos compartits en xarxa."
              - "Treballa en grup per comprovar l'accés als recursos compartits del sistema."
          - curt: "Monitoratge"
            text: "Realitza tasques de monitoratge i ús del sistema operatiu en xarxa, descrivint les eines utilitzades i identificant les principals incidències."
            criteris:
              - "Descriu les característiques dels programes de monitoratge."
              - "Identifica problemes de rendiment en els dispositius d'emmagatzematge."
              - "Observa l'activitat del sistema operatiu en xarxa a partir de les traces generades pel propi sistema."
              - "Realitza tasques de manteniment del programari instal·lat en el sistema."
              - "Executa operacions per a l'automatització de tasques del sistema."
              - "Interpreta la informació de configuració del sistema operatiu en xarxa."
          - curt: "Integració de sistemes lliures i propietaris"
            text: "Realitza tasques d'integració de sistemes operatius lliures i propietaris, descrivint els avantatges de compartir recursos i instal·lant programari específic."
            criteris:
              - "Identifica la necessitat de compartir recursos en xarxa entre diferents sistemes operatius."
              - "Comprova la connectivitat de la xarxa en un escenari heterogeni."
              - "Descriu la funcionalitat dels serveis que permeten compartir recursos en xarxa."
              - "Instal·la i configura serveis per compartir recursos en xarxa."
              - "Accedeix a sistemes d'arxius en xarxa des d'equips amb diferents sistemes operatius."
              - "Accedeix a impressores des d'equips amb diferents sistemes operatius."
              - "Treballa en grup."
              - "Estableix nivells de seguretat per controlar l'accés de l'usuari als recursos compartits en xarxa."
              - "Comprova el funcionament dels serveis instal·lats."

      - codi: "0228"
        nom: "Aplicacions web"
        ras:
          - curt: "Gestors de continguts"
            text: "Instal·la gestors de continguts, identificant-ne les aplicacions i configurant-los segons requeriments."
            criteris:
              - "Identifica els requeriments necessaris per instal·lar gestors de continguts."
              - "Gestiona usuaris amb rols diferents."
              - "Personalitza la interfície del gestor de continguts."
              - "Realitza proves de funcionament."
              - "Realitza tasques d'actualització del gestor de continguts, especialment les de seguretat."
              - "Instal·la i configura els mòduls i menús necessaris."
              - "Activa i configura els mecanismes de seguretat proporcionats pel propi gestor de continguts."
              - "Habilita fòrums i estableix regles d'accés."
              - "Realitza còpies de seguretat dels continguts del gestor."
          - curt: "Aprenentatge a distància (LMS)"
            text: "Instal·la sistemes de gestió d'aprenentatge a distància, descrivint-ne l'estructura del lloc i la jerarquia de directoris generada."
            criteris:
              - "Reconeix l'estructura del lloc i la jerarquia de directoris generada."
              - "Realitza modificacions en l'estètica o aspecte del lloc."
              - "Manipula i genera perfils personalitzats."
              - "Comprova la funcionalitat de les comunicacions mitjançant fòrums, consultes, entre d'altres."
              - "Importa i exporta continguts en diferents formats."
              - "Realitza còpies de seguretat i restauracions."
              - "Realitza informes d'accés i utilització del lloc."
              - "Comprova la seguretat del lloc."
          - curt: "Gestió d'arxius web"
            text: "Instal·la serveis de gestió d'arxius web, identificant-ne les aplicacions i verificant-ne la integritat."
            criteris:
              - "Estableix la utilitat d'un servei de gestió d'arxius web."
              - "Descriu diferents aplicacions de gestió d'arxius web."
              - "Instal·la i adapta una eina de gestió d'arxius web."
              - "Crea i classifica comptes d'usuari en funció dels seus permisos."
              - "Gestiona arxius i directoris."
              - "Utilitza arxius d'informació addicional."
              - "Aplica criteris d'indexació sobre els arxius i directoris."
              - "Comprova la seguretat del gestor d'arxius."
          - curt: "Ofimàtica web"
            text: "Instal·la aplicacions d'ofimàtica web, descrivint-ne les característiques i entorns d'ús."
            criteris:
              - "Estableix la utilitat de les aplicacions d'ofimàtica web."
              - "Descriu diferents aplicacions d'ofimàtica web (processador de textos, full de càlcul, entre altres)."
              - "Instal·la aplicacions d'ofimàtica web."
              - "Gestiona els comptes d'usuari."
              - "Aplica criteris de seguretat en l'accés dels usuaris."
              - "Reconeix les prestacions específiques de cadascuna de les aplicacions instal·lades."
              - "Utilitza les aplicacions de forma col·laborativa."
          - curt: "Aplicacions web d'escriptori"
            text: "Instal·la aplicacions web d'escriptori, descrivint-ne les característiques i entorns d'ús."
            criteris:
              - "Descriu diferents aplicacions web d'escriptori."
              - "Instal·la aplicacions per a proveir d'accés web al servei de correu electrònic."
              - "Configura les aplicacions per a integrar-les amb un servidor de correu."
              - "Gestiona els comptes d'usuari."
              - "Verifica l'accés al correu electrònic."
              - "Instal·la aplicacions de calendari web."
              - "Reconeix les prestacions específiques de les aplicacions instal·lades (cites, tasques, entre altres)."

  - id: asix
    nom: "ASIX"
    titol: "Administració de Sistemes Informàtics en Xarxa"
    grau: "CFGS"
    icona: "material/server-network"
    moduls:
      - codi: "0377"
        nom: "Administració de sistemes gestors de bases de dades"
        ras:
          - curt: "Implantació de l'SGBD"
            text: "Implanta sistemes gestors de bases de dades analitzant les característiques i ajustant-se als requeriments del sistema."
            criteris:
              - "Reconeix la utilitat i funció de cadascun dels elements d'un sistema gestor de bases de dades."
              - "Analitza les característiques dels principals sistemes gestors de bases de dades."
              - "Selecciona el sistema gestor de bases de dades."
              - "Identifica el programari necessari per dur a terme la instal·lació."
              - "Verifica el compliment dels requisits de maquinari."
              - "Instal·la sistemes gestors de bases de dades."
              - "Documenta el procés d'instal·lació."
              - "Interpreta la informació subministrada pels missatges d'error i fitxers de registre."
              - "Soluciona les incidències de la instal·lació."
              - "Verifica el funcionament del sistema gestor de bases de dades."
          - curt: "Configuració de l'SGBD"
            text: "Configura el sistema gestor de bases de dades interpretant-ne les especificacions tècniques i els requisits d'explotació."
            criteris:
              - "Descriu les condicions d'inici i d'aturada del sistema gestor de bases de dades."
              - "Selecciona el motor de base de dades."
              - "Assegura els comptes d'administració."
              - "Configura les eines i el programari client del sistema gestor."
              - "Configura la connectivitat en xarxa del sistema gestor."
              - "Defineix les característiques per defecte de la base de dades."
              - "Defineix els paràmetres relatius a les connexions: temps d'espera, nombre màxim de connexions, entre d'altres."
              - "Documenta el procés de configuració."
          - curt: "Control d'accés"
            text: "Implanta mètodes de control d'accés utilitzant assistents, eines gràfiques i comandes del llenguatge del sistema gestor."
            criteris:
              - "Crea vistes personalitzades per a cada tipus d'usuari."
              - "Crea sinònims de taules i vistes."
              - "Defineix i elimina comptes d'usuari."
              - "Identifica els privilegis sobre la base de dades i els seus elements."
              - "Agrupa i desagrupa privilegis."
              - "Assigna i elimina privilegis a usuaris."
              - "Assigna i elimina grups de privilegis a usuaris."
              - "Garanteix el compliment dels requisits de seguretat."
          - curt: "Automatització de tasques"
            text: "Automatitza tasques d'administració del gestor descrivint-les i utilitzant guions de sentències."
            criteris:
              - "Reconeix la importància d'automatitzar tasques administratives."
              - "Descriu els diferents mètodes d'execució de guions."
              - "Identifica les eines disponibles per redactar guions."
              - "Defineix i utilitza guions per automatitzar tasques."
              - "Identifica els esdeveniments susceptibles d'activar disparadors."
              - "Defineix disparadors."
              - "Utilitza estructures de control de flux."
              - "Adopta mesures per mantenir la integritat i consistència de la informació."
          - curt: "Monitoratge i rendiment"
            text: "Optimitza el rendiment del sistema aplicant tècniques de monitoratge i realitzant adaptacions."
            criteris:
              - "Identifica les eines de monitoratge disponibles per al sistema gestor."
              - "Descriu els avantatges i inconvenients de la creació d'índexs."
              - "Crea índexs en taules i vistes."
              - "Optimitza l'estructura de la base de dades."
              - "Optimitza els recursos del sistema gestor."
              - "Obté informació sobre el rendiment de les consultes per optimitzar-les."
              - "Desenvolupa alertes de rendiment."
              - "Realitza modificacions en la configuració del sistema operatiu per millorar el rendiment del gestor."
          - curt: "Disponibilitat i replicació"
            text: "Aplica criteris de disponibilitat analitzant-los i ajustant la configuració del sistema gestor."
            criteris:
              - "Reconeix la utilitat de les bases de dades distribuïdes."
              - "Descriu les diferents polítiques de fragmentació de la informació."
              - "Implanta una base de dades distribuïda homogènia."
              - "Crea una base de dades distribuïda mitjançant la integració d'un conjunt de bases de dades preexistents."
              - "Configura un node mestre i d'altres esclaus, per replicar el primer."
              - "Configura un sistema de replicació en cadena."
              - "Comprova l'efecte de l'aturada de diversos nodes sobre el sistema distribuït i replicat."

      - codi: "1665"
        nom: "Digitalització aplicada als sectors productius"
        ras:
          - curt: "Digitalització i entorns IT/OT"
            text: "Analitza el concepte de digitalització i la seva repercussió en els sectors productius tenint en compte l'activitat de l'empresa i identificant entorns IT (tecnologia de la informació) i OT (tecnologia d'operació) característics."
            criteris:
              - "Descriu en què consisteix el concepte de digitalització."
              - "Relaciona la implantació de la tecnologia digital amb l'organització de les empreses."
              - "Estableix les diferències i similituds entre els entorns IT i OT."
              - "Identifica els departaments típics de les empreses que poden constituir entorns IT."
              - "Selecciona les tecnologies típiques de la digitalització en planta i en negoci."
              - "Analitza la importància de la connexió entre entorns IT i OT."
              - "Analitza els avantatges de digitalitzar una empresa industrial d'extrem a extrem."
          - curt: "Tecnologies habilitadores digitals"
            text: "Caracteritza les tecnologies habilitadores digitals necessàries per a l'adequació/transformació de les empreses a entorns digitals descrivint les seves característiques i aplicacions."
            criteris:
              - "Identifica les principals tecnologies habilitadores digitals."
              - "Relaciona les THD amb el desenvolupament de productes i serveis."
              - "Relaciona la importància de les THD amb l'economia sostenible i eficient."
              - "Identifica nous mercats generats per les THD."
              - "Analitza la implicació de THD tant en la part de negoci com en la part de planta."
              - "Identifica les millores produïdes a causa de la implantació de les tecnologies habilitadores en relació amb els entorns IT i OT."
              - "Elabora un informe que relacioni les tecnologies amb les seves característiques i àrees d'aplicació."
          - curt: "Sistemes cloud"
            text: "Identifica sistemes basats en cloud/núvol i la seva influència en el desenvolupament dels sistemes digitals."
            criteris:
              - "Identifica els diferents nivells del cloud/núvol."
              - "Identifica les principals funcions del cloud/núvol (processament de dades, intercanvi d'informació, execució d'aplicacions, entre altres)."
              - "Descriu el concepte d'edge computing i la seva relació amb el cloud/núvol."
              - "Defineix els conceptes de fog i mist i les seves zones d'aplicació en el conjunt."
              - "Identifica els avantatges que proporciona la utilització del cloud/núvol en els sistemes connectats."
          - curt: "Intel·ligència artificial"
            text: "Identifica aplicacions de la IA (intel·ligència artificial) en entorns del sector on està emmarcat el títol descrivint les millores implícites en la seva implementació."
            criteris:
              - "Identifica la importància de la IA en l'automatització de processos i la seva optimització."
              - "Relaciona la IA amb la recollida massiva de dades (Big Data) i el seu tractament (anàlisi) amb la rendibilitat de les empreses."
              - "Valora la importància present i futura de la IA."
              - "Identifica els sectors amb implantació més rellevant de IA."
              - "Identifica els llenguatges de programació en IA."
              - "Descriu com influeix la IA en el sector del títol."
          - curt: "Dades i ciberseguretat"
            text: "Avalua la importància de les dades, així com la seva protecció en una economia digital globalitzada, definint sistemes de seguretat i ciberseguretat tant a nivell d'equip/sistema, com a globals."
            criteris:
              - "Estableix la diferència entre dada i informació."
              - "Descriu el cicle de vida de la dada."
              - "Identifica la relació entre Big Data, anàlisi de dades, machine/deep learning i intel·ligència artificial."
              - "Descriu les característiques que defineixen Big Data."
              - "Descriu les etapes típiques de la ciència de dades i la seva relació en el procés."
              - "Descriu els procediments d'emmagatzematge de dades en el cloud/núvol."
              - "Descriu la importància del cloud computing."
              - "Identifica els principals objectius de la ciència de dades en les diferents empreses."
              - "Valora la importància de la seguretat i la seva regulació en relació amb les dades."
          - curt: "Projecte de transformació digital"
            text: "Desenvolupa un projecte de transformació digital d'una empresa d'un sector relacionat amb el títol, tenint en compte els canvis que s'han de produir en funció dels objectius de l'empresa."
            criteris:
              - "Identifica els objectius estratègics de l'empresa."
              - "Identifica i alinea les àrees de producció/negoci i de comunicacions."
              - "Identifica les àrees susceptibles de ser digitalitzades."
              - "Analitza l'encaix de les àrees digitalitzades entre si i amb les que no ho estan."
              - "Té en compte les necessitats presents i futures de l'empresa."
              - "Relaciona cadascuna de les àrees amb la implantació de les tecnologies."
              - "Analitza les possibles bretxes de seguretat en cadascuna de les àrees."
              - "Defineix el tractament de les dades i la seva anàlisi."
              - "Té en compte la integració entre dades, aplicacions i plataformes que les suporten, entre altres."
              - "Documenta els canvis realitzats en funció de l'estratègia."
              - "Té en compte la idoneïtat dels recursos humans."

      - codi: "1708"
        nom: "Sostenibilitat aplicada al sistema productiu"
        ras:
          - curt: "Aspectes ASG i desenvolupament sostenible"
            text: "Identifica els aspectes ambientals, socials i de governança (ASG) relatius a la sostenibilitat tenint en compte el concepte de desenvolupament sostenible i els marcs internacionals que contribueixen a la seva consecució."
            criteris:
              - "Descriu el concepte de sostenibilitat, establint els marcs internacionals associats al desenvolupament sostenible."
              - "Identifica els assumptes ambientals, socials i de governança que influeixen en el desenvolupament sostenible de les organitzacions empresarials."
              - "Relaciona els Objectius de Desenvolupament Sostenible (ODS) amb la seva importància per a la consecució de l'Agenda 2030."
              - "Analitza la importància d'identificar els aspectes ASG més rellevants per als grups d'interès de les organitzacions relacionant-los amb els riscos i oportunitats que suposen per a la pròpia organització."
              - "Identifica els principals estàndards de mètriques per a l'avaluació de l'acompliment en sostenibilitat i el seu paper en la rendició de comptes que marca la legislació vigent i les futures regulacions en desenvolupament."
              - "Descriu la inversió socialment responsable i el paper dels analistes, inversores, agències i índexs de sostenibilitat en el foment de la sostenibilitat."
          - curt: "Reptes ambientals i socials"
            text: "Caracteritza els reptes ambientals i socials als quals s'enfronta la societat, descrivint els impactes sobre les persones i els sectors productius i proposant accions per a minimitzar-los."
            criteris:
              - "Identifica els principals reptes ambientals i socials."
              - "Relaciona els reptes ambientals i socials amb el desenvolupament de l'activitat econòmica."
              - "Analitza l'efecte dels impactes ambientals i socials sobre les persones i els sectors productius."
              - "Identifica les mesures i accions encaminades a minimitzar els impactes ambientals i socials."
              - "Analitza la importància d'establir aliances i treballar de manera transversal i coordinada per a abordar amb èxit els reptes ambientals i socials."
          - curt: "Criteris de sostenibilitat"
            text: "Estableix l'aplicació de criteris de sostenibilitat en l'acompliment professional i personal, identificant els elements necessaris."
            criteris:
              - "Identifica els ODS més rellevants per a l'activitat professional que realitza."
              - "Analitza els riscos i oportunitats que representen els ODS."
              - "Identifica les accions necessàries per atendre alguns dels reptes ambientals i socials des de l'activitat professional i l'entorn personal."
          - curt: "Productes i serveis responsables"
            text: "Proposa productes i serveis responsables tenint en compte els principis de l'economia circular."
            criteris:
              - "Caracteritza el model de producció i consum actual."
              - "Identifica els principis de l'economia verda i circular."
              - "Contrasta els beneficis de l'economia verda i circular enfront del model clàssic de producció."
              - "Aplica principis d'ecodisseny."
              - "Analitza el cicle de vida del producte."
              - "Identifica els processos de producció i els criteris de sostenibilitat aplicats."
          - curt: "Activitats sostenibles"
            text: "Realitza activitats sostenibles minimitzant l'impacte de les mateixes en el medi ambient."
            criteris:
              - "Caracteritza el model de producció i consum actual."
              - "Identifica els principis de l'economia verda i circular."
              - "Contrasta els beneficis de l'economia verda i circular enfront del model clàssic de producció."
              - "Avalua l'impacte de les activitats personals i professionals."
              - "Aplica principis d'ecodisseny."
              - "Aplica estratègies sostenibles."
              - "Analitza el cicle de vida del producte."
              - "Identifica els processos de producció i els criteris de sostenibilitat aplicats."
              - "Aplica la normativa ambiental."
          - curt: "Pla de sostenibilitat"
            text: "Analitza un pla de sostenibilitat d'una empresa del sector, identificant els seus grups d'interès, els aspectes ASG materials i justificant accions per a la seva gestió i mesurament."
            criteris:
              - "Identifica els principals grups d'interès de l'empresa."
              - "Analitza els aspectes ASG materials, les expectatives dels grups d'interès i la importància dels aspectes ASG en relació amb els objectius empresarials."
              - "Defineix accions encaminades a minimitzar els impactes negatius i aprofitar les oportunitats que plantegen els principals aspectes ASG identificats."
              - "Determina les mètriques d'avaluació de l'acompliment de l'empresa d'acord amb els estàndards de sostenibilitat més àmpliament utilitzats."
              - "Elabora un informe de sostenibilitat amb el pla i els indicadors proposats."

  - id: asixc
    nom: "ASIX Ciber"
    titol: "ASIX, perfil professional Ciberseguretat"
    grau: "CFGS"
    icona: "material/shield-lock"
    moduls:
      - codi: "0375"
        nom: "Serveis de xarxa i internet"
        ras:
          - curt: "Administra serveis de resolució de noms, analitzant-los i garantint la seguretat del servei"
            text: "Administra serveis de resolució de noms, analitzant-los i garantint la seguretat del servei."
            criteris:
              - "Identifica i descriu escenaris en els quals sorgeix la necessitat d'un servei de resolució de noms."
              - "Classifica els principals mecanismes de resolució de noms."
              - "Descriu l'estructura, la nomenclatura i funcionalitat dels sistemes de noms jeràrquics."
              - "Instal·la i configura serveis jeràrquics de resolució de noms."
              - "Prepara el servei per reenviar consultes de recursos externs a un altre servidor de noms."
              - "Prepara el servei per emmagatzemar i distribuir les respostes procedents d'altres servidors."
              - "Afegeix registres de noms corresponents a una zona nova, amb opcions relatives a servidors de correu i àlies."
              - "Implementa solucions de servidors de noms en adreces IP dinàmiques."
              - "Realitza transferències de zona entre dos o més servidors."
              - "Documenta els procediments d'instal·lació i configuració."
          - curt: "Configuració automàtica (DHCP)"
            text: "Administra serveis de configuració automàtica, identificant-los i verificant la correcta assignació dels paràmetres."
            criteris:
              - "Reconeix els mecanismes automatitzats de configuració dels paràmetres de xarxa i els avantatges que proporcionen."
              - "Il·lustra els procediments i les pautes que intervenen en una sol·licitud de configuració dels paràmetres de xarxa."
              - "Instal·la servidors de configuració dels paràmetres de xarxa."
              - "Prepara el servei per assignar la configuració bàsica als equips d'una xarxa local."
              - "Configura assignacions estàtiques i dinàmiques."
              - "Integra en el servei opcions addicionals de configuració."
              - "Documenta els procediments realitzats."
          - curt: "Servidors web"
            text: "Administra servidors web aplicant criteris de configuració i assegurant el funcionament del servei."
            criteris:
              - "Descriu els fonaments i protocols en els quals es basa el funcionament d'un servidor web."
              - "Instal·la i configura servidors web."
              - "Amplia la funcionalitat del servidor mitjançant l'activació i configuració de mòduls."
              - "Crea i configura llocs web virtuals."
              - "Configura els mecanismes d'autenticació i control d'accés del servidor."
              - "Obté i instal·la certificats digitals."
              - "Estableix mecanismes per assegurar les comunicacions entre el client i el servidor."
              - "Realitza proves de monitoratge del servei."
              - "Analitza els registres del servei per a l'elaboració d'estadístiques i la resolució d'incidències."
              - "Elabora documentació relativa a la instal·lació, configuració i recomanacions d'ús del servei."
          - curt: "Transferència de fitxers"
            text: "Administra serveis de transferència de fitxers assegurant i limitant l'accés a la informació."
            criteris:
              - "Estableix la utilitat i el mode d'operació del servei de transferència de fitxers."
              - "Instal·la i configura servidors de transferència de fitxers."
              - "Crea usuaris i grups per a l'accés remot al servidor."
              - "Configura l'accés anònim."
              - "Estableix límits en els diferents modes d'accés."
              - "Comprova l'accés al servidor, tant en mode actiu com en mode passiu."
              - "Realitza proves amb clients en línia d'ordres i amb clients de manera gràfica."
              - "Utilitza el navegador com a client del servei de transferència de fitxers."
              - "Elabora documentació relativa a la instal·lació, configuració i recomanacions d'ús del servei."
          - curt: "Correu electrònic"
            text: "Administra servidors de correu electrònic, aplicant criteris de configuració i garantint la seguretat del servei."
            criteris:
              - "Descriu els diferents protocols que intervenen en l'enviament i recollida del correu electrònic."
              - "Instal·la i configura un servidor de correu electrònic."
              - "Crea comptes d'usuari i en verifica l'accés."
              - "Estableix i aplica mètodes per impedir usos indeguts del servidor de correu electrònic."
              - "Instal·la serveis per permetre la recollida remota del correu existent a les bústies d'usuari."
              - "Usa clients de correu electrònic per enviar i rebre correu des dels comptes creats al servidor."
              - "Utilitza la signatura digital i el correu xifrat."
              - "Configura el servidor de correu com a servei segur."
              - "Elabora documentació relativa a la instal·lació, configuració i recomanacions d'ús del servei."
          - curt: "Missatgeria, notícies i llistes"
            text: "Administra serveis de missatgeria instantània, notícies i llistes de distribució, verificant i assegurant l'accés dels usuaris."
            criteris:
              - "Descriu els serveis de missatgeria instantània, notícies i llistes de distribució."
              - "Instal·la i configura el servei de missatgeria instantània."
              - "Utilitza clients gràfics i de text de missatgeria instantània."
              - "Instal·la i configura el servei de notícies."
              - "Instal·la i configura el servei de llistes de distribució."
              - "Determina el tipus de llista i els modes d'accés permesos."
              - "Crea comptes d'usuari i verifica l'accés als serveis de missatgeria instantània, notícies i llistes de distribució."
              - "Elabora documentació relativa a la instal·lació, configuració i recomanacions d'ús dels serveis de missatgeria instantània, notícies i llistes de distribució."
          - curt: "Serveis d'àudio"
            text: "Administra serveis d'àudio identificant-ne les necessitats de distribució i adaptant els formats."
            criteris:
              - "Descriu la funcionalitat del servei d'àudio."
              - "Instal·la i configura un servidor de distribució d'àudio."
              - "Instal·la i configura el client per a l'accés al servidor d'àudio."
              - "Reconeix i utilitza formats d'àudio digital."
              - "Utilitza eines de reproducció d'àudio al client."
              - "Utilitza serveis d'àudio a través del navegador."
              - "Utilitza tècniques de sindicació i subscripció d'àudio."
              - "Elabora documentació relativa a la instal·lació i administració del servidor d'àudio."
          - curt: "Serveis de vídeo"
            text: "Administra serveis de vídeo identificant-ne les necessitats de distribució i adaptant els formats."
            criteris:
              - "Descriu la funcionalitat dels servidors de vídeo."
              - "Instal·la i configura un servidor de vídeo."
              - "Configura el client per a l'accés al servidor de vídeo."
              - "Reconeix i utilitza formats de compressió de vídeo digital."
              - "Utilitza tècniques de sindicació i subscripció de vídeo."
              - "Descriu les característiques i els protocols utilitzats en el servei de videoconferència."
              - "Instal·la i configura eines gràfiques per fer videoconferències."
              - "Utilitza eines gràfiques i navegadors per fer videoconferències."
              - "Elabora documentació relativa a la instal·lació i administració dels servidors de vídeo i del servei de videoconferència."
